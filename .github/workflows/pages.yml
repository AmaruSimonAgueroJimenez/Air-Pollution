name: Publicar resultados en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'docs/**'
      - 'others_files/**'
      - 'presentaciones/**'
      - 'output_files/**'
      - 'config/github_pages.json'
      - 'others_scripts/preparar_github_pages.py'
      - 'others_scripts/tests/test_github_pages.py'
  pull_request:
    paths:
      - '.github/workflows/pages.yml'
      - 'docs/**'
      - 'others_files/**'
      - 'presentaciones/**'
      - 'output_files/**'
      - 'config/github_pages.json'
      - 'others_scripts/preparar_github_pages.py'
      - 'others_scripts/tests/test_github_pages.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener archivos versionados
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Probar publicación sin modelos ni descargas
        run: python3 -B -m unittest discover -s others_scripts/tests -p test_github_pages.py -v
      - name: Preparar HTML existentes y comprobar enlaces
        run: python3 -B others_scripts/preparar_github_pages.py --include-manifest config/github_pages.json --output _site
      - name: Empaquetar sólo el sitio estático
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publicar sin Jekyll ni ejecución de QMD
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
